server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tmcra.com www.tmcra.com;

    ssl_certificate /etc/letsencrypt/live/tmcra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmcra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    # The staff control plane is never exposed on the public website origin.
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    location = /downloads/TMCRA-Memory-Setup-latest.exe {
        alias /opt/tmcra-release/shared/downloads/TMCRA-Memory-Setup-latest.exe;
        limit_except GET { deny all; }
        types { }
        default_type application/vnd.microsoft.portable-executable;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /downloads/TMCRA-Memory-Setup-latest.exe.sha256 {
        alias /opt/tmcra-release/shared/downloads/TMCRA-Memory-Setup-latest.exe.sha256;
        limit_except GET { deny all; }
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /downloads/tmcra-memory-desktop-release.json {
        alias /opt/tmcra-release/shared/downloads/tmcra-memory-desktop-release.json;
        limit_except GET { deny all; }
        types { }
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /downloads/desktop/windows/x64/latest.yml {
        alias /opt/tmcra-release/shared/downloads/desktop/windows/x64/latest.yml;
        limit_except GET { deny all; }
        default_type application/x-yaml;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/desktop/windows/x64/(TMCRA-Memory-Setup-(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?-x64\.exe)$ {
        alias /opt/tmcra-release/shared/downloads/desktop/windows/x64/$1;
        limit_except GET { deny all; }
        default_type application/vnd.microsoft.portable-executable;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/desktop/windows/x64/(TMCRA-Memory-Setup-(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?-x64\.exe\.blockmap)$ {
        alias /opt/tmcra-release/shared/downloads/desktop/windows/x64/$1;
        limit_except GET { deny all; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /downloads/TMCRA-Memory-Mobile-latest.apk {
        alias /opt/tmcra-release/shared/downloads/TMCRA-Memory-Mobile-latest.apk;
        limit_except GET { deny all; }
        types { }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /downloads/TMCRA-Memory-Mobile-latest.apk.sha256 {
        alias /opt/tmcra-release/shared/downloads/TMCRA-Memory-Mobile-latest.apk.sha256;
        limit_except GET { deny all; }
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /downloads/tmcra-memory-mobile-android-release.json {
        alias /opt/tmcra-release/shared/downloads/tmcra-memory-mobile-android-release.json;
        limit_except GET { deny all; }
        types { }
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/mobile/android/(TMCRA-Memory-Mobile-(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?\.(?:apk|aab))$ {
        alias /opt/tmcra-release/shared/downloads/mobile/android/$1;
        limit_except GET { deny all; }
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/(TMCRA-Memory-latest-(?:x64|arm64)\.dmg)$ {
        alias /opt/tmcra-release/shared/downloads/macos-current/$1;
        limit_except GET { deny all; }
        types { }
        default_type application/x-apple-diskimage;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/(TMCRA-Memory-latest-(?:x64|arm64)\.dmg\.sha256)$ {
        alias /opt/tmcra-release/shared/downloads/macos-current/$1;
        limit_except GET { deny all; }
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/(tmcra-memory-desktop-macos-(?:x64|arm64)-release\.json)$ {
        alias /opt/tmcra-release/shared/downloads/macos-current/$1;
        limit_except GET { deny all; }
        types { }
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/desktop/macos/(x64|arm64)/latest-mac\.yml$ {
        alias /opt/tmcra-release/shared/downloads/macos-current/desktop/macos/$1/latest-mac.yml;
        limit_except GET { deny all; }
        types { }
        default_type application/x-yaml;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/desktop/macos/(x64|arm64)/(TMCRA-Memory-(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?-(?:x64|arm64)\.(?:dmg|zip)(?:\.blockmap)?)$ {
        alias /opt/tmcra-release/shared/downloads/macos-current/desktop/macos/$1/$2;
        limit_except GET { deny all; }
        types {
            application/x-apple-diskimage dmg;
            application/zip zip;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:2000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The application trusts this header only from its loopback reverse proxy.
        proxy_set_header X-TMCRA-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# Dedicated staff control-plane listener. The included file contains exact
# operator-IP allow rules followed by `deny all;`.
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name tmcra.com www.tmcra.com;

    ssl_certificate /etc/letsencrypt/live/tmcra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmcra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/tmcra-internal-allowlist.conf;

    client_max_body_size 2m;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = / {
        return 302 /internal;
    }

    location / {
        proxy_pass http://127.0.0.1:2000;
        proxy_http_version 1.1;
        # Preserve :9443 so same-origin checks use the exact staff origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-TMCRA-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tmcra.com www.tmcra.com;
    return 301 https://$host$request_uri;
}
