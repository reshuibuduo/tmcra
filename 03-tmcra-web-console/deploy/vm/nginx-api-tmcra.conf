upstream tmcra_api_tunnel {
    # Primary: the GPU host establishes a direct reverse tunnel to this VM.
    server 127.0.0.1:22019 max_fails=1 fail_timeout=5s;
    # Backup: VM-initiated forwarding through the GPUHome SSH ingress.
    server 127.0.0.1:22009 backup;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    server_name api.tmcra.com;

    client_max_body_size 4m;

    location / {
        proxy_pass http://tmcra_api_tunnel;
        proxy_http_version 1.1;

        # The tunnel is restricted to the API process on the GPU host.
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/api.tmcra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tmcra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tmcra.com;
    return 301 https://$host$request_uri;
}
