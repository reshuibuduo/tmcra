[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmcra-langgraph"
version = "0.1.0"
description = "LangGraph long-term memory nodes for TMCRA"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["tmcra-client>=0.3.0", "langgraph>=1.2,<2"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.data-files]
"share/tmcra-langgraph" = ["README.md", "README.zh-CN.md", "INSTALL.md", "INSTALL.zh-CN.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
