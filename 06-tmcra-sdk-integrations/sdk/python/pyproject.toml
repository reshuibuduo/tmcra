[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmcra-client"
version = "0.3.0rc1"
description = "Typed synchronous and asynchronous Python client for the TMCRA Memory API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
]
authors = [{ name = "TMCRA" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.scripts]
tmcra-sdk-smoke = "tmcra_client.server_smoke:main"

[project.urls]
Homepage = "https://tmcra.com"
Documentation = "https://tmcra.com/docs"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tmcra_client*"]

[tool.setuptools.package-data]
tmcra_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
