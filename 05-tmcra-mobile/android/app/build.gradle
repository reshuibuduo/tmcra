import java.security.MessageDigest

apply plugin: 'com.android.application'

def requestedAbi = (project.findProperty('tmcraTestAbi') ?: 'arm64-v8a').toString()
def supportedAbis = ['arm64-v8a', 'x86_64']
if (!supportedAbis.contains(requestedAbi)) {
    throw new GradleException(
            "Unsupported tmcraTestAbi '${requestedAbi}'. Expected one of ${supportedAbis.join(', ')}")
}

def generatedModelAssets = file("${buildDir}/generated/tmcra-model-assets")
def fileSha256 = { File input ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[1024 * 1024]
        int count
        while ((count = stream.read(buffer)) >= 0) digest.update(buffer, 0, count)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

