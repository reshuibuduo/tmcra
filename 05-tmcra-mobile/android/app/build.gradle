def modelFetchTasks = []
modelSpecs.each { spec ->
    File cacheFile = file("${rootProject.projectDir}/../.build-cache/models/${spec.outputName}")
    def task = tasks.register("fetch${spec.key}") {
        outputs.file(cacheFile)
        outputs.upToDateWhen {
            cacheFile.isFile() && fileSha256(cacheFile) == spec.sha256
        }
        doLast {
            if (cacheFile.isFile() && fileSha256(cacheFile) == spec.sha256) return
            cacheFile.parentFile.mkdirs()
            File temporary = new File(cacheFile.parentFile, "${spec.outputName}.partial")
            if (temporary.exists() && !temporary.delete()) {
                throw new GradleException("Unable to replace partial model asset ${spec.outputName}")
            }
            String localPath = System.getenv(spec.pathEnv) ?: ''
            if (localPath) {
                File source = file(localPath)
                if (!source.isFile()) throw new GradleException("${spec.pathEnv} is not a file")
                source.withInputStream { input ->
                    temporary.withOutputStream { output -> input.transferTo(output) }
                }
            } else {
                String assetUrl = System.getenv(spec.urlEnv) ?: spec.url
                logger.lifecycle("Downloading pinned TMCRA model asset ${spec.outputName}")
                URLConnection connection = new URL(assetUrl).openConnection()
                connection.connectTimeout = 30_000
                connection.readTimeout = 300_000
                connection.setRequestProperty('User-Agent', 'TMCRA-Android-Build/0.3.0-rc1')
                connection.inputStream.withCloseable { input ->
                    temporary.withOutputStream { output -> input.transferTo(output) }
                }
            }
            String actual = fileSha256(temporary)
            if (actual != spec.sha256) {
                temporary.delete()
                throw new GradleException("Model checksum mismatch for ${spec.outputName}: ${actual}")
            }
            java.nio.file.Files.move(
                    temporary.toPath(),
                    cacheFile.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
    modelFetchTasks.add(task)
}

def stageOnDeviceModels = tasks.register('stageOnDeviceModels') {
    dependsOn modelFetchTasks
    inputs.files modelSpecs.collect { spec ->
        file("${rootProject.projectDir}/../.build-cache/models/${spec.outputName}")
    }
    outputs.dir(generatedModelAssets)
    doLast {
        delete generatedModelAssets
        generatedModelAssets.mkdirs()
        modelSpecs.each { spec ->
            copy {
                from file("${rootProject.projectDir}/../.build-cache/models/${spec.outputName}")
                into generatedModelAssets
            }
        }
    }
}

android {
    namespace = "com.tmcra.memory.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId "com.tmcra.memory.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "0.3.0-rc1"
        // The first hardware-validation build targets modern Android phones.
        // x86_64 is available only through -PtmcraTestAbi=x86_64 for the server emulator gate.
        // Release invocations keep the default arm64-v8a ABI.
        ndk {
            abiFilters requestedAbi
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            noCompress 'onnx'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def storePath = System.getenv('TMCRA_ANDROID_KEYSTORE')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('TMCRA_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('TMCRA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('TMCRA_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Keep developer builds beside an already installed production-signed app.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            def releaseRequested = gradle.startParameter.taskNames.any {
                it.toLowerCase(Locale.ROOT).contains('release')
            }
            if (releaseRequested && !System.getenv('TMCRA_ANDROID_KEYSTORE')) {
                throw new GradleException('Release signing environment is required for TMCRA mobile release builds.')
            }
            if (System.getenv('TMCRA_ANDROID_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main.assets.srcDir generatedModelAssets
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /merge.*Assets/) task.dependsOn(stageOnDeviceModels)
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // sherpa-onnx as a local AAR keeps the build independent of jitpack reachability on CN networks.
    implementation files('libs/sherpa-onnx-v1.13.4.aar')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
