name: Release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Version and credential checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify release versions
        run: python scripts/check_release_versions.py
      - name: Scan tracked files for credentials
        run: python scripts/check_release_secrets.py

  core-and-benchmarks:
    name: Memory API and benchmark suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 02-tmcra-memory-api/requirements-tmcra-service.txt
      - name: Install production runtime dependencies
        run: python -m pip install -r 02-tmcra-memory-api/requirements-tmcra-service.txt
      - name: Verify portable service and model substitution
        working-directory: 02-tmcra-memory-api
        run: python -m unittest test_portable_release.py test_tmcra_service_model_flexibility.py
      - name: Run frozen benchmark contracts
        working-directory: 09-tmcra-benchmarks
        env:
          PYTHONPATH: ${{ github.workspace }}/09-tmcra-benchmarks/algorithm:${{ github.workspace }}/02-tmcra-memory-api
        run: python -m unittest discover -s . -p 'test*.py'
      - name: Verify benchmark release manifest
        working-directory: 09-tmcra-benchmarks
        run: python generate_release_manifest.py --check

  python-integrations:
    name: Python SDK, integrations, and MCP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            06-tmcra-sdk-integrations/sdk/python/pyproject.toml
            06-tmcra-sdk-integrations/integrations/langgraph/pyproject.toml
            06-tmcra-sdk-integrations/integrations/openai-agents/pyproject.toml
            08-tmcra-mcp-server/pyproject.toml
      - name: Install Python packages
        run: >-
          python -m pip install
          -e "06-tmcra-sdk-integrations/sdk/python[test]"
          -e "06-tmcra-sdk-integrations/integrations/langgraph[test]"
          -e "06-tmcra-sdk-integrations/integrations/openai-agents[test]"
          -e "08-tmcra-mcp-server"
      - name: Test Python SDK
        working-directory: 06-tmcra-sdk-integrations/sdk/python
        run: python -m pytest -q
      - name: Test Hermes integration
        working-directory: 06-tmcra-sdk-integrations/integrations/hermes
        run: python -m unittest discover -s tests -v
      - name: Test LangGraph integration
        working-directory: 06-tmcra-sdk-integrations/integrations/langgraph
        run: python -m pytest -q
      - name: Test OpenAI Agents integration
        working-directory: 06-tmcra-sdk-integrations/integrations/openai-agents
        run: python -m pytest -q
      - name: Test MCP server
        working-directory: 08-tmcra-mcp-server
        run: python -m pytest -q
      - name: Test Microsoft Agent Framework contract
        run: python 06-tmcra-sdk-integrations/integrations/microsoft-agent-framework/test_contract.py

  node-packages:
    name: Node package — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: TypeScript SDK
            directory: 06-tmcra-sdk-integrations/sdk/typescript
          - label: Vercel AI SDK
            directory: 06-tmcra-sdk-integrations/integrations/vercel-ai-sdk
          - label: OpenClaw
            directory: 06-tmcra-sdk-integrations/integrations/openclaw
          - label: Desktop
            directory: 04-tmcra-desktop
          - label: Mobile shell
            directory: 05-tmcra-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts
      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Typecheck when provided
        working-directory: ${{ matrix.directory }}
        run: npm run typecheck --if-present
      - name: Build when provided
        working-directory: ${{ matrix.directory }}
        run: npm run build --if-present

  web-console:
    name: Web console build and security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: 03-tmcra-web-console/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        working-directory: 03-tmcra-web-console
        run: npm ci --ignore-scripts
      - name: Build and run Web contracts
        working-directory: 03-tmcra-web-console
        run: npm test
      - name: Run Web security contracts
        working-directory: 03-tmcra-web-console
        run: npm run test:security
      - name: Lint Web source
        working-directory: 03-tmcra-web-console
        run: npm run lint

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run Android gate
        working-directory: 05-tmcra-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

  dotnet-integration:
    name: Microsoft Agent Framework build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build and pack integration
        run: >-
          dotnet pack
          06-tmcra-sdk-integrations/integrations/microsoft-agent-framework/src/TMCRA.AgentFramework/TMCRA.AgentFramework.csproj
          --configuration Release
